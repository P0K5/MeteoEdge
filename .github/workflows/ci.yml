name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'graphify-out/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'graphify-out/**'

jobs:
  graphify-guard:
    name: Guard against graphify-out/ changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Check for unwanted graphify-out/ changes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO_OWNER: ${{ github.repository_owner }}
        REPO_NAME: ${{ github.event.repository.name }}
      run: bash scripts/check_graphify_guard.sh

  lint:
    name: Lint (flake8)
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install uv
      run: pip install uv

    - name: Install flake8
      run: uv pip install flake8 --system

    - name: Run flake8
      run: python -m flake8 src/

    - name: Check prompt drift (single-source governance/graphify)
      run: bash scripts/check_prompt_drift.sh

  test:
    name: Test (pytest)
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install uv
      run: pip install uv

    - name: Install dependencies
      run: uv pip install -r requirements.txt --system

    - name: Run tests with coverage
      run: |
        python -m pytest src/tests -q -n auto --dist loadfile \
          --cov=src \
          --cov-report=term-missing \
          --cov-fail-under=60

    - name: Run integration tests
      run: |
        python -m pytest tests/integration -q -m integration
