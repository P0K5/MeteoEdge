name: Graphify Knowledge Graph Update

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'graphify-out/**'
      - '.github/workflows/graphify-update.yml'

  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 03:00 UTC

  workflow_dispatch:
    inputs:
      force_full:
        description: 'Force full semantic rebuild'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  # -------------------------------------------------------
  # JOB 1: Incremental update — runs on every push to master
  # Only re-processes changed code files. AST pass is free.
  # Skipped on scheduled runs (full rebuild handles those).
  # -------------------------------------------------------
  incremental-update:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Deploy key is the sole ruleset bypass actor for master (issue #1534).
          # When the secret is absent, this input is empty and checkout falls
          # back to GITHUB_TOKEN — unchanged behaviour until the owner
          # provisions the key.
          ssh-key: ${{ secrets.CI_PUSH_DEPLOY_KEY }}
          persist-credentials: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Graphify
        run: pip install graphifyy==0.9.118 openai

      - name: Create .graphifyignore
        run: |
          cat > .graphifyignore << 'EOF'
          data/
          backtest_results/
          archive/
          *.csv
          *.parquet
          *.pkl
          __pycache__/
          .env
          EOF

      - name: Restore graphify cache
        uses: actions/cache/restore@v4
        with:
          path: graphify-out/cache
          key: graphify-cache-${{ github.run_id }}
          restore-keys: |
            graphify-cache-

      - name: Incremental graph update (code only, free)
        run: graphify update . --force

      - name: Save graphify cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: graphify-out/cache
          key: graphify-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit updated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add graphify-out/graph.json
          git diff --staged --quiet || git commit -m "chore(graph): incremental graph update [skip ci]"
          git pull --rebase origin master
          git push

  # -------------------------------------------------------
  # JOB 2: Full rebuild — runs weekly (Monday 03:00 UTC)
  # or manually via workflow_dispatch.
  # Re-extracts all docs semantically + re-clusters communities.
  # Cost: first run after the cache lands here is ~$1 (full
  # re-send of all docs to DeepSeek). Every run after that only
  # re-sends files that changed or were left incomplete by a
  # prior truncated/retried run, gated by the restored
  # graphify-out/cache plus the committed manifest.json.
  # -------------------------------------------------------
  full-rebuild:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Deploy key is the sole ruleset bypass actor for master (issue #1534).
          # When the secret is absent, this input is empty and checkout falls
          # back to GITHUB_TOKEN — unchanged behaviour until the owner
          # provisions the key.
          ssh-key: ${{ secrets.CI_PUSH_DEPLOY_KEY }}
          persist-credentials: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Graphify
        run: pip install graphifyy==0.9.118 openai

      - name: Create .graphifyignore
        run: |
          cat > .graphifyignore << 'EOF'
          data/
          backtest_results/
          archive/
          *.csv
          *.parquet
          *.pkl
          __pycache__/
          .env
          EOF

      - name: Restore graphify cache
        uses: actions/cache/restore@v4
        with:
          path: graphify-out/cache
          key: graphify-cache-${{ github.run_id }}
          restore-keys: |
            graphify-cache-

      - name: Full semantic extraction
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GRAPHIFY_MAX_OUTPUT_TOKENS: "32768"
        run: |
          graphify extract . \
            --backend deepseek \
            --max-concurrency 4 \
            --token-budget 32000 \
            --no-cluster

      - name: Save graphify cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: graphify-out/cache
          key: graphify-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Cluster and label communities
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: graphify cluster-only . --backend deepseek

      - name: Commit full graph rebuild
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add graphify-out/graph.json \
                  graphify-out/GRAPH_REPORT.md \
                  graphify-out/.graphify_labels.json \
                  graphify-out/manifest.json
          git diff --staged --quiet || git commit -m "chore(graph): weekly full graph rebuild [skip ci]"
          git pull --rebase origin master
          git push
