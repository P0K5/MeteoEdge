<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeteoEdge Portfolio</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://unpkg.com/chart.js@4/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth}

:root{
  --text-xs:clamp(0.75rem,0.7rem + 0.2vw,0.8125rem);
  --text-sm:clamp(0.8125rem,0.75rem + 0.3vw,0.9375rem);
  --text-base:clamp(0.9375rem,0.85rem + 0.35vw,1.0625rem);
  --text-lg:clamp(1.0625rem,0.95rem + 0.5vw,1.25rem);
  --text-xl:clamp(1.25rem,1rem + 1vw,1.75rem);
  --space-1:0.25rem;--space-2:0.5rem;--space-3:0.75rem;--space-4:1rem;
  --space-5:1.25rem;--space-6:1.5rem;--space-8:2rem;--space-10:2.5rem;
  --radius-sm:0.375rem;--radius-md:0.5rem;--radius-lg:0.75rem;--radius-xl:1rem;--radius-full:9999px;
  --transition:180ms cubic-bezier(0.16,1,0.3,1);
  --font-body:'Satoshi','Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}

[data-theme="dark"]{
  --bg:#0c0e12;--surface:#12151b;--surface-2:#181c24;--surface-off:#1d222d;
  --surface-dyn:#252b38;--divider:#1a1f2b;--border:#232a38;
  --text:#cdd1de;--muted:#6a7290;--faint:#2e3448;--inverse:#0c0e12;
  --primary:#5ba3d8;--primary-h:#3d8cc4;--primary-bg:#142033;
  --yes:#4dc480;--yes-bg:#102617;--yes-dim:#1a3824;
  --no:#e06060;--no-bg:#2a1212;--no-dim:#3a1e1e;
  --warn:#e8a845;--warn-bg:#2a1f08;
  --edge:#b07fe8;--edge-bg:#1e1530;
  --sh-sm:0 1px 3px #00000040;--sh-md:0 4px 16px #00000055;
}
[data-theme="light"]{
  --bg:#f0f2f8;--surface:#fff;--surface-2:#f7f8fc;--surface-off:#edf0f8;
  --surface-dyn:#e3e8f2;--divider:#e0e5f0;--border:#d0d8ea;
  --text:#18202e;--muted:#5e6a88;--faint:#b8c2d8;--inverse:#fff;
  --primary:#1a6fa0;--primary-h:#155a84;--primary-bg:#d4eaf5;
  --yes:#1e7a42;--yes-bg:#d8f0e3;--yes-dim:#e8f7ee;
  --no:#b82020;--no-bg:#f8dada;--no-dim:#fef0f0;
  --warn:#9a6010;--warn-bg:#fef0d8;
  --edge:#6040b0;--edge-bg:#ece8f8;
  --sh-sm:0 1px 3px #1820380a;--sh-md:0 4px 16px #1820380f;
}

body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:var(--text-sm);min-height:100dvh;}
button{cursor:pointer;background:none;border:none;color:inherit;font:inherit;}
a,button,input,select{transition:color var(--transition),background var(--transition),border-color var(--transition),box-shadow var(--transition);}

/* ── TOPBAR ── */
.topbar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 var(--space-6);height:58px;
  display:flex;align-items:center;gap:var(--space-4);
  position:sticky;top:0;z-index:50;
}
.logo{display:flex;align-items:center;gap:var(--space-3);text-decoration:none;}
.logo-img{height:36px;width:auto;display:block;}
.logo-text{font-weight:700;font-size:var(--text-base);color:var(--text);}
.logo-sub{font-size:var(--text-xs);color:var(--muted);}
.topbar-spacer{flex:1;}
.live-pill{
  display:flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:var(--radius-full);
  background:var(--yes-bg);color:var(--yes);font-size:var(--text-xs);font-weight:600;
}
.live-dot{width:6px;height:6px;border-radius:var(--radius-full);background:var(--yes);animation:blink 2s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.theme-btn{
  padding:var(--space-2);border-radius:var(--radius-md);
  color:var(--muted);display:flex;align-items:center;
}
.theme-btn:hover{background:var(--surface-off);color:var(--text);}

/* ── MAIN CONTENT ── */
.main{max-width:980px;margin:0 auto;padding:var(--space-6) var(--space-4) var(--space-10);}

/* ── WALLET ROW ── */
.wallet-row{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--space-4);
  margin-bottom:var(--space-6);
}
@media(max-width:600px){.wallet-row{grid-template-columns:1fr 1fr;}}
.wallet-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:var(--space-5);
  box-shadow:var(--sh-sm);
}
.wc-label{font-size:var(--text-xs);font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:var(--space-2);}
.wc-value{font-size:var(--text-xl);font-weight:700;font-variant-numeric:tabular-nums lining-nums;line-height:1.1;}
.wc-sub{font-size:var(--text-xs);color:var(--muted);margin-top:var(--space-2);}
.wc-value.pos{color:var(--yes);}
.wc-value.neg{color:var(--no);}

/* ── SECTION HEADER ── */
.section-hdr{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:var(--space-4);
}
.section-title{font-size:var(--text-base);font-weight:700;display:flex;align-items:center;gap:var(--space-2);}
.section-title i{width:16px;height:16px;color:var(--primary);}
.count-pill{
  background:var(--surface-off);color:var(--muted);
  font-size:var(--text-xs);font-weight:600;padding:2px 8px;
  border-radius:var(--radius-full);
}

/* ── POSITION CARD ── */
.pos-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-xl);
  margin-bottom:var(--space-4);
  box-shadow:var(--sh-sm);
  overflow:hidden;
  transition:box-shadow var(--transition);
}
.pos-card:hover{box-shadow:var(--sh-md);}

.pos-header{
  padding:var(--space-5) var(--space-5) var(--space-4);
  display:flex;align-items:flex-start;gap:var(--space-4);
}
.pos-icon{
  width:40px;height:40px;border-radius:var(--radius-md);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:18px;
}
.icon-yes{background:var(--yes-bg);}
.icon-no{background:var(--no-bg);}
.pos-meta{flex:1;min-width:0;}
.pos-question{
  font-weight:600;font-size:var(--text-sm);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-bottom:4px;
}
.pos-station{font-size:var(--text-xs);color:var(--muted);display:flex;align-items:center;gap:4px;}
.pos-station i{width:12px;height:12px;}
.pos-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.side-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 10px;border-radius:var(--radius-full);
  font-size:var(--text-xs);font-weight:700;letter-spacing:.05em;
}
.side-yes{background:var(--yes-bg);color:var(--yes);}
.side-no{background:var(--no-bg);color:var(--no);}
.pos-edge-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 8px;border-radius:var(--radius-full);
  font-size:var(--text-xs);font-weight:600;
}
.edge-positive{background:var(--edge-bg);color:var(--edge);}
.edge-zero{background:var(--surface-off);color:var(--muted);}
.edge-negative{background:var(--no-bg);color:var(--no);}

/* ── PROB ROW ── */
.prob-row{
  padding:0 var(--space-5) var(--space-4);
  display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:var(--space-4);
}
@media(max-width:600px){.prob-row{grid-template-columns:1fr 1fr;}}
.prob-value.nws{color:var(--muted);}
.prob-item{}
.prob-label{font-size:var(--text-xs);color:var(--muted);font-weight:500;margin-bottom:3px;}
.prob-value{font-size:var(--text-base);font-weight:700;font-variant-numeric:tabular-nums;}
.prob-value.market{color:var(--primary);}
.prob-value.mine{color:var(--text);}
.prob-value.edge-pos{color:var(--edge);}
.prob-value.edge-neg{color:var(--no);}
.prob-value.entry{color:var(--muted);}

/* ── VALUE BAR (Polymarket style) ── */
.value-section{
  padding:var(--space-4) var(--space-5);
  border-top:1px solid var(--divider);
  background:var(--surface-2);
}
.value-hdr{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:var(--space-3);font-size:var(--text-xs);color:var(--muted);font-weight:500;
}
.value-nums{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:var(--space-2);
}
.val-current{font-size:var(--text-sm);font-weight:700;font-variant-numeric:tabular-nums;}
.val-target{font-size:var(--text-sm);font-weight:700;font-variant-numeric:tabular-nums;color:var(--yes);}
.val-invested{font-size:var(--text-xs);color:var(--muted);}

/* Progress bar */
.prog-track{
  height:8px;background:var(--surface-off);border-radius:var(--radius-full);
  overflow:visible;position:relative;
}
.prog-fill{
  height:100%;border-radius:var(--radius-full);
  transition:width 1s cubic-bezier(.16,1,.3,1);
  position:relative;
}
.prog-fill-yes{background:var(--yes);}
.prog-fill-no{background:var(--no);}
.prog-fill-warn{background:var(--warn);}
.prog-target-line{
  position:absolute;right:0;top:-4px;
  width:2px;height:16px;background:var(--yes);opacity:.7;
  border-radius:var(--radius-full);
}

/* ── FOOTER ROW of card ── */
.pos-footer{
  padding:var(--space-3) var(--space-5);
  border-top:1px solid var(--divider);
  display:flex;align-items:center;justify-content:space-between;
  gap:var(--space-4);
}
.pos-footer-left{display:flex;align-items:center;gap:var(--space-4);}
.footer-stat{font-size:var(--text-xs);color:var(--muted);}
.footer-stat strong{color:var(--text);font-weight:600;}
.footer-bracket{
  font-family:var(--font-mono);font-size:var(--text-xs);
  color:var(--muted);
}
.pos-ts{font-size:var(--text-xs);color:var(--muted);font-family:var(--font-mono);}

/* ── CLOSED SECTION ── */
.closed-section{margin-top:var(--space-8);}
.pagination{
  display:flex;align-items:center;justify-content:center;
  gap:var(--space-3);margin-top:var(--space-4);
}
.pg-btn{
  background:var(--surface);border:1px solid var(--border);color:var(--text);
  border-radius:var(--radius-md);padding:var(--space-2) var(--space-4);
  font-size:var(--text-sm);font-family:var(--font-body);cursor:pointer;
  transition:background var(--transition);
}
.pg-btn:hover:not(:disabled){background:var(--surface-dyn);}
.pg-btn:disabled{opacity:.35;cursor:default;}
.pg-info{font-size:var(--text-sm);color:var(--muted);font-variant-numeric:tabular-nums;}
.closed-row{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:var(--space-4) var(--space-5);
  display:flex;align-items:center;gap:var(--space-4);
  margin-bottom:var(--space-3);
  box-shadow:var(--sh-sm);
  opacity:.7;
}
.closed-row:hover{opacity:1;}
.closed-q{flex:1;font-size:var(--text-sm);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.closed-pnl{font-weight:700;font-variant-numeric:tabular-nums;font-size:var(--text-sm);}
.closed-pnl.win{color:var(--yes);}
.closed-pnl.loss{color:var(--no);}
.result-badge{
  font-size:var(--text-xs);font-weight:700;padding:2px 8px;border-radius:var(--radius-full);
}
.result-win{background:var(--yes-bg);color:var(--yes);}
.result-loss{background:var(--no-bg);color:var(--no);}

/* ── LOG SECTION ── */
.log-section{margin-top:var(--space-8);}
.log-box{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:var(--space-4);
  max-height:480px;overflow:auto;
  font-family:var(--font-mono);font-size:var(--text-xs);
  color:var(--text);
  white-space:pre;
  line-height:1.45;
  box-shadow:var(--sh-sm);
}
.log-box .log-line{display:block;}
.log-box .log-empty{color:var(--muted);font-family:var(--font-body);white-space:normal;}
.log-meta{font-size:var(--text-xs);color:var(--muted);margin-bottom:var(--space-2);font-family:var(--font-mono);}

/* ── EMPTY ── */
.empty{
  text-align:center;padding:var(--space-10) var(--space-8);
  color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:var(--space-4);
}
.empty i{width:40px;height:40px;color:var(--faint);}
.empty h3{font-size:var(--text-base);color:var(--text);}
.empty p{font-size:var(--text-sm);max-width:32ch;}

/* ── TOOLTIP on edge ── */
.edge-hint{
  font-size:var(--text-xs);color:var(--muted);
  padding:var(--space-2) var(--space-5);
  border-top:1px solid var(--divider);
  display:flex;align-items:center;gap:6px;
}
.edge-hint i{width:12px;height:12px;flex-shrink:0;}

/* ── REFRESH BTN ── */
.btn-outline{
  padding:6px 14px;border-radius:var(--radius-md);
  border:1px solid var(--border);background:var(--surface);
  color:var(--muted);font-size:var(--text-xs);font-weight:600;
  display:inline-flex;align-items:center;gap:6px;
}
.btn-outline:hover{background:var(--surface-off);color:var(--text);}
.btn-outline i{width:13px;height:13px;}

/* ── FALLBACK TAG ── */
.fallback-tag{
  font-size:10px;color:var(--muted);font-weight:500;font-family:var(--font-mono);
  margin-left:5px;opacity:.65;vertical-align:middle;
}

/* ── LIVE MODEL SUB-LINE ── */
.prob-sub{
  font-size:10px;color:var(--muted);font-weight:500;font-family:var(--font-mono);
  margin-top:3px;
}
.prob-sub.up{color:var(--yes);}
.prob-sub.down{color:var(--warn);}

/* ── CHART ── */
.chart-section{border-top:1px solid var(--divider);background:var(--surface-2);padding:var(--space-4) var(--space-5);}
.chart-wrap{position:relative;height:180px;}
.chart-empty{color:var(--muted);font-size:var(--text-xs);text-align:center;padding:var(--space-8) 0;}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:var(--surface-dyn);border-radius:var(--radius-full);}

/* ── SHIMMER loader ── */
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.skeleton{
  background:linear-gradient(90deg,var(--surface-off) 25%,var(--surface-dyn) 50%,var(--surface-off) 75%);
  background-size:200% 100%;animation:shimmer 1.5s ease-in-out infinite;border-radius:var(--radius-sm);
}

/* ── ERROR BANNER ── */
.error-banner{
  background:var(--no-bg);border:1px solid var(--no-dim);color:var(--no);
  border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);
  font-size:var(--text-xs);font-weight:600;margin-bottom:var(--space-4);
  display:none;align-items:center;gap:var(--space-2);
}
.error-banner.visible{display:flex;}
</style>
</head>
<body>

<!-- ── TOPBAR ── -->
<header class="topbar">
  <div class="logo">
    <img src="/logo.png" alt="MeteoEdge" class="logo-img">
    <div>
      <div class="logo-text">MeteoEdge</div>
      <div class="logo-sub" id="last-updated">Polymarket Weather Trading</div>
    </div>
  </div>
  <div class="topbar-spacer"></div>
  <div class="live-pill"><div class="live-dot"></div>Live</div>
  <button class="btn-outline" onclick="refresh()"><i data-lucide="refresh-cw"></i>Refresh</button>
  <button class="theme-btn" onclick="toggleTheme()" id="theme-btn" aria-label="Toggle theme">
    <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
</header>

<!-- ── MAIN ── -->
<main class="main">

  <div class="error-banner" id="error-banner">
    <i data-lucide="alert-circle"></i>
    <span id="error-text">Could not reach /api/portfolio — retrying…</span>
  </div>

  <!-- WALLET ROW -->
  <div class="wallet-row">
    <div class="wallet-card">
      <div class="wc-label">Portfolio Value</div>
      <div class="wc-value" id="val-portfolio">—</div>
      <div class="wc-sub" id="val-portfolio-sub">—</div>
    </div>
    <div class="wallet-card">
      <div class="wc-label">Cash / USDC</div>
      <div class="wc-value" id="val-cash">—</div>
      <div class="wc-sub">Available to deploy</div>
    </div>
    <div class="wallet-card">
      <div class="wc-label">Invested in Trades</div>
      <div class="wc-value" id="val-invested">—</div>
      <div class="wc-sub" id="val-invested-sub">— open positions</div>
    </div>
  </div>

  <!-- OPEN POSITIONS -->
  <div class="section-hdr">
    <div class="section-title"><i data-lucide="zap"></i>Open Positions</div>
    <span class="count-pill" id="open-count">0</span>
  </div>
  <div id="open-positions"></div>

  <!-- CLOSED -->
  <div class="closed-section">
    <div class="section-hdr">
      <div class="section-title"><i data-lucide="check-circle-2"></i>Recent Closed</div>
      <span class="count-pill" id="closed-count">0</span>
    </div>
    <div id="closed-positions"></div>
    <div class="pagination" id="closed-pagination" style="display:none">
      <button class="pg-btn" id="pg-prev" onclick="closedChangePage(-1)">&#8592; Prev</button>
      <span class="pg-info" id="pg-info"></span>
      <button class="pg-btn" id="pg-next" onclick="closedChangePage(1)">Next &#8594;</button>
    </div>
  </div>

  <!-- BOT LOG -->
  <div class="log-section">
    <div class="section-hdr">
      <div class="section-title"><i data-lucide="terminal"></i>Bot Log</div>
      <span class="count-pill" id="log-count">0</span>
    </div>
    <div class="log-meta" id="log-meta">logs/bot.log — last 200 lines</div>
    <div class="log-box" id="bot-log"><span class="log-empty">Loading…</span></div>
  </div>

</main>

<script>
/* ─────────────────────────────────────────
   STATION LOOKUP — enriches the code string
   from the API with a display name & emoji
   ───────────────────────────────────────── */
const STATIONS = {
  KLAX:{name:'Los Angeles Intl',emoji:'☀️'},
  KORD:{name:'Chicago O\'Hare',emoji:'🌩️'},
  KJFK:{name:'New York JFK',emoji:'🌧️'},
  KLGA:{name:'New York LaGuardia',emoji:'🌧️'},
  EGLL:{name:'London Heathrow',emoji:'🌦️'},
  KMIA:{name:'Miami Intl',emoji:'🌡️'},
  KDEN:{name:'Denver Intl',emoji:'⛅️'},
  KBKF:{name:'Denver Buckley',emoji:'⛅️'},
  KATL:{name:'Atlanta Intl',emoji:'⛅️'},
  KSEA:{name:'Seattle-Tacoma',emoji:'🌧️'},
  KHOU:{name:'Houston Hobby',emoji:'⛅️'},
  KAUS:{name:'Austin-Bergstrom',emoji:'☀️'},
  KSFO:{name:'San Francisco Intl',emoji:'🌫️'},
};

function stationMeta(code) {
  return STATIONS[code] || {name: code, emoji: '🌡️'};
}

function buildQuestion(code, side, bracket_low, bracket_high) {
  const dir = side === 'YES' ? '' : 'NOT ';
  return `Will daily high at ${code} ${dir}be between ${bracket_low}°F–${bracket_high}°F?`;
}

/* ─────────────────────────────────────────
   RENDER
   ───────────────────────────────────────── */

function edgeClass(edge) {
  if (edge > 3) return 'edge-positive';
  if (edge < -3) return 'edge-negative';
  return 'edge-zero';
}
function edgeLabel(edge) {
  if (edge > 3) return `+${edge.toFixed(1)}¢ (model > market)`;
  if (edge < -3) return `${edge.toFixed(1)}¢ (market > model)`;
  return '≈ 0¢ edge';
}
function fmtUSD(v) {
  const sign = v >= 0 ? '+' : '-';
  return `${sign}$${Math.abs(v).toFixed(2)}`;
}

function renderWallet(positions, cashUsdc) {
  const invested = positions.reduce((s, p) => s + p.invested, 0);
  const currentVal = positions.reduce((s, p) => s + p.current_value, 0);
  const unrealisedTotal = positions.reduce((s, p) => s + (p.current_value - p.invested), 0);
  const totalPortfolio = cashUsdc + currentVal;

  document.getElementById('val-portfolio').textContent = '$' + totalPortfolio.toFixed(2);
  const upnl = unrealisedTotal >= 0
    ? `+$${unrealisedTotal.toFixed(2)} unrealised`
    : `-$${Math.abs(unrealisedTotal).toFixed(2)} unrealised`;
  const subEl = document.getElementById('val-portfolio-sub');
  subEl.textContent = upnl;
  subEl.style.color = unrealisedTotal >= 0 ? 'var(--yes)' : 'var(--no)';

  document.getElementById('val-cash').textContent = '$' + Math.max(0, cashUsdc).toFixed(2);
  document.getElementById('val-invested').textContent = '$' + invested.toFixed(2);
  document.getElementById('val-invested-sub').textContent =
    `${positions.length} open position${positions.length !== 1 ? 's' : ''}`;
}

function renderOpen(positions) {
  const el = document.getElementById('open-positions');
  document.getElementById('open-count').textContent = positions.length;

  if (!positions.length) {
    el.innerHTML = `<div class="empty"><i data-lucide="inbox"></i><h3>No open positions</h3><p>MeteoEdge will place trades here when market conditions align.</p></div>`;
    lucide.createIcons();
    return;
  }

  el.innerHTML = positions.map(p => {
    const isYes = p.side === 'YES';
    const meta = stationMeta(p.station);
    const unrealised = p.current_value - p.invested;
    const fillPct = Math.min(100, Math.max(0, (p.current_value / p.target_value) * 100)).toFixed(1);
    const fillClass = unrealised >= 0 ? 'prog-fill-yes' : 'prog-fill-no';
    const unrealisedFmt = fmtUSD(unrealised);
    const unrealisedClass = unrealised >= 0 ? 'pos' : 'neg';
    const edgeCls = edgeClass(p.edge);
    const hasEdge = p.edge > 3;
    const edgeLbl = edgeLabel(p.edge);
    const question = p.question || buildQuestion(p.station, p.side, p.bracket_low, p.bracket_high);
    const hasLive = p.my_prob_now != null && p.my_prob !== p.entry_price;
    const liveDelta = hasLive ? p.my_prob_now - p.my_prob : 0;
    const liveDeltaCls = liveDelta > 1 ? 'up' : liveDelta < -1 ? 'down' : '';
    const liveDeltaTxt = liveDelta >= 0 ? `+${liveDelta}` : `${liveDelta}`;
    const liveSub = hasLive
      ? `<div class="prob-sub ${liveDeltaCls}">live: ${p.my_prob_now}¢ (${liveDeltaTxt}¢)</div>`
      : '';

    return `<div class="pos-card">
      <div class="pos-header">
        <div class="pos-icon ${isYes ? 'icon-yes' : 'icon-no'}">${meta.emoji}</div>
        <div class="pos-meta">
          <div class="pos-question" title="${question}">${question}</div>
          <div class="pos-station"><i data-lucide="map-pin"></i>${p.station ? `${meta.name} · ${p.station}` : '—'}</div>
        </div>
        <div class="pos-right">
          <span class="side-badge ${isYes ? 'side-yes' : 'side-no'}">${p.side}</span>
          <span class="pos-edge-badge ${edgeCls}">${edgeLbl}</span>
        </div>
      </div>

      <div class="prob-row">
        <div class="prob-item">
          <div class="prob-label">Market price</div>
          <div class="prob-value market">${p.market_prob}¢</div>
        </div>
        <div class="prob-item">
          <div class="prob-label">Model fair value</div>
          <div class="prob-value ${p.my_prob === p.entry_price ? 'entry' : 'mine'}">${p.my_prob}¢${p.my_prob === p.entry_price ? '<span class="fallback-tag">no data</span>' : ''}</div>
          ${liveSub}
        </div>
        <div class="prob-item">
          <div class="prob-label">Entry price</div>
          <div class="prob-value entry">${p.entry_price}¢</div>
        </div>
        <div class="prob-item">
          <div class="prob-label">NWS High</div>
          <div class="prob-value nws">${p.forecast_high_f != null ? p.forecast_high_f.toFixed(1) + '°F' : '—'}</div>
        </div>
        <div class="prob-item">
          <div class="prob-label">Unrealised P&L</div>
          <div class="prob-value ${unrealisedClass}">${unrealisedFmt}</div>
        </div>
      </div>

      <div class="value-section">
        <div class="value-hdr">
          <span>Current value vs target payout</span>
          <span>${fillPct}% of max</span>
        </div>
        <div class="value-nums">
          <div>
            <div class="val-invested">Invested: $${p.invested.toFixed(2)}</div>
            <div class="val-current">Current: $${p.current_value.toFixed(2)}</div>
          </div>
          <div class="val-target">▶ Win: $${p.target_value.toFixed(2)}</div>
        </div>
        <div class="prog-track">
          <div class="prog-fill ${fillClass}" style="width:${fillPct}%">
            <div class="prog-target-line"></div>
          </div>
        </div>
      </div>

      ${hasEdge
        ? `<div class="edge-hint"><i data-lucide="trending-up"></i>Model (${p.my_prob}¢) − market (${p.market_prob}¢) = <strong>+${p.edge.toFixed(1)}¢</strong> — market underpricing our side. Position still advantaged.</div>`
        : p.edge < -3
        ? `<div class="edge-hint"><i data-lucide="alert-triangle"></i>Model (${p.my_prob}¢) − market (${p.market_prob}¢) = <strong>${p.edge.toFixed(1)}¢</strong> — market moved against model.</div>`
        : `<div class="edge-hint"><i data-lucide="minus-circle"></i>Model (${p.my_prob}¢) ≈ market (${p.market_prob}¢) — edge near zero, market has priced in this outcome.</div>`}

      ${p.token_id ? `<div class="chart-section" id="chart-${p.token_id}"><div class="chart-wrap"><canvas id="canvas-${p.token_id}"></canvas></div></div>` : ''}

      <div class="pos-footer">
        <div class="pos-footer-left">
          <div class="footer-stat"><strong>${p.shares}</strong> shares @ $${(p.entry_price / 100).toFixed(2)}</div>
          ${(p.bracket_low || p.bracket_high) ? `<div class="footer-bracket">bracket: ${p.bracket_low}°F – ${p.bracket_high}°F</div>` : ''}
        </div>
        <div class="pos-ts">${p.station}</div>
      </div>
    </div>`;
  }).join('');

  lucide.createIcons();
  _autoLoadCharts(positions);
}

const CLOSED_PAGE_SIZE = 15;
let _closedAll = [];
let _closedPage = 0;

function renderClosed(positions) {
  _closedAll = positions;
  _closedPage = 0;
  document.getElementById('closed-count').textContent = positions.length;
  _renderClosedPage();
}

function closedChangePage(delta) {
  const total = Math.ceil(_closedAll.length / CLOSED_PAGE_SIZE);
  _closedPage = Math.max(0, Math.min(_closedPage + delta, total - 1));
  _renderClosedPage();
}

function _renderClosedPage() {
  const el = document.getElementById('closed-positions');
  const pgEl = document.getElementById('closed-pagination');

  if (!_closedAll.length) {
    el.innerHTML = `<div class="empty"><i data-lucide="clock"></i><h3>No closed trades</h3><p>Exited positions will appear here.</p></div>`;
    pgEl.style.display = 'none';
    lucide.createIcons();
    return;
  }

  const total = Math.ceil(_closedAll.length / CLOSED_PAGE_SIZE);
  const start = _closedPage * CLOSED_PAGE_SIZE;
  const page = _closedAll.slice(start, start + CLOSED_PAGE_SIZE);

  el.innerHTML = page.map(p => {
    const win = p.pnl >= 0;
    const question = p.question || buildQuestion(p.station, p.side, p.bracket_low, p.bracket_high);
    const pnlFmt = (p.pnl >= 0 ? '+' : '') + '$' + Math.abs(p.pnl).toFixed(2);
    const d = p.closed_at ? new Date(p.closed_at) : null;
    const age = d && !isNaN(d) ? d.toLocaleString() : '—';
    return `<div class="closed-row">
      <span class="result-badge ${win ? 'result-win' : 'result-loss'}">${win ? 'WIN' : 'LOSS'}</span>
      <div class="closed-q" title="${question}">${question}</div>
      <div class="footer-bracket">${p.station || p.side} · ${p.entry_price}¢ → ${p.exit_price}¢</div>
      <div class="closed-pnl ${win ? 'win' : 'loss'}">${pnlFmt}</div>
      <div class="pos-ts">${age}</div>
    </div>`;
  }).join('');

  pgEl.style.display = total > 1 ? 'flex' : 'none';
  document.getElementById('pg-info').textContent = `Page ${_closedPage + 1} of ${total}`;
  document.getElementById('pg-prev').disabled = _closedPage === 0;
  document.getElementById('pg-next').disabled = _closedPage === total - 1;

  lucide.createIcons();
}

/* ─────────────────────────────────────────
   API
   ───────────────────────────────────────── */

async function fetchPortfolio() {
  const banner = document.getElementById('error-banner');
  try {
    const r = await fetch('/api/portfolio');
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();

    banner.classList.remove('visible');

    renderWallet(data.open_positions, data.cash_usdc);
    renderOpen(data.open_positions);
    renderClosed(data.closed_positions || []);

    const ts = data.updated_at
      ? 'State: ' + new Date(data.updated_at).toLocaleTimeString()
      : 'Last fetch: ' + new Date().toLocaleTimeString();
    document.getElementById('last-updated').textContent = ts;
  } catch (e) {
    banner.classList.add('visible');
    document.getElementById('error-text').textContent = `Fetch failed (${e.message}) — retrying in 30s`;
    console.error('Portfolio fetch failed:', e);
  }
}

async function fetchBotLog() {
  const box = document.getElementById('bot-log');
  const countEl = document.getElementById('log-count');
  const metaEl = document.getElementById('log-meta');
  try {
    const r = await fetch('/api/bot-log?lines=200');
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    const lines = data.lines || [];
    countEl.textContent = lines.length;
    metaEl.textContent = (data.path || 'bot.log') + ' — last ' + lines.length + ' lines';
    if (!lines.length) {
      box.innerHTML = `<span class="log-empty">${data.error ? 'Error: ' + data.error : 'Log file is empty.'}</span>`;
      return;
    }
    const wasNearBottom = (box.scrollHeight - box.scrollTop - box.clientHeight) < 40;
    box.textContent = lines.join('\n');
    if (wasNearBottom) box.scrollTop = box.scrollHeight;
  } catch (e) {
    box.innerHTML = `<span class="log-empty">Failed to load log (${e.message})</span>`;
    console.error('Bot log fetch failed:', e);
  }
}

function refresh() {
  fetchPortfolio();
  fetchBotLog();
  const icon = document.querySelector('.btn-outline i');
  if (icon) {
    icon.style.transition = 'transform 0.5s';
    icon.style.transform = 'rotate(360deg)';
    setTimeout(() => { icon.style.transform = ''; icon.style.transition = ''; }, 600);
  }
}

function toggleTheme() {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  const btn = document.getElementById('theme-icon');
  btn.innerHTML = next === 'dark'
    ? '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
    : '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
}

/* ─────────────────────────────────────────
   POSITION CHARTS
   ───────────────────────────────────────── */

function _autoLoadCharts(positions) {
  positions.forEach(p => {
    if (p.token_id) _renderChart(p.token_id, p.entry_price, p.my_prob);
  });
}

async function _renderChart(tokenId, entryPrice, myProb) {
  const canvasId = 'canvas-' + tokenId;
  const wrap = document.getElementById(canvasId)?.parentElement;
  if (!wrap) return;

  wrap.innerHTML = '<div class="chart-empty">Loading…</div>';

  let rows;
  try {
    const r = await fetch('/api/positions/' + encodeURIComponent(tokenId) + '/snapshots');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    rows = await r.json();
  } catch (e) {
    wrap.innerHTML = '<div class="chart-empty">Error: ' + e.message + '</div>';
    return;
  }

  if (!rows.length) {
    wrap.innerHTML = '<div class="chart-empty">No snapshots yet — recorded every poll once the position is open.</div>';
    return;
  }

  wrap.innerHTML = '<canvas id="' + canvasId + '"></canvas>';
  const canvas = document.getElementById(canvasId);

  const cs = getComputedStyle(document.documentElement);
  const clr = k => cs.getPropertyValue(k).trim();

  const labels = rows.map(d => {
    const t = new Date(d.ts);
    return t.getUTCHours().toString().padStart(2, '0') + ':' + t.getUTCMinutes().toString().padStart(2, '0') + ' UTC';
  });

  new Chart(canvas, {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: 'Market bid',
          data: rows.map(d => d.market_bid),
          borderColor: clr('--primary'),
          backgroundColor: 'transparent',
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.25,
          spanGaps: true,
          fill: false,
        },
        {
          label: 'Model fair value',
          data: rows.map(d => d.fair_value),
          borderColor: clr('--edge'),
          backgroundColor: 'transparent',
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.25,
          spanGaps: true,
          fill: false,
        },
        {
          label: 'Entry ' + entryPrice + '¢',
          data: rows.map(() => entryPrice),
          borderColor: clr('--muted') + '88',
          borderWidth: 1,
          borderDash: [4, 4],
          pointRadius: 0,
          fill: false,
        },
        {
          label: 'Target ' + myProb + '¢',
          data: rows.map(() => myProb),
          borderColor: clr('--yes') + 'bb',
          borderWidth: 1,
          borderDash: [3, 3],
          pointRadius: 0,
          fill: false,
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          labels: {
            color: clr('--text'),
            boxWidth: 10,
            padding: 12,
            font: { size: 10, family: "'JetBrains Mono', monospace" },
          },
        },
        tooltip: {
          callbacks: {
            label: ctx => ctx.dataset.label + ': ' + (ctx.parsed.y != null ? ctx.parsed.y + '¢' : '—'),
          },
        },
      },
      scales: {
        x: {
          ticks: { color: clr('--muted'), maxTicksLimit: 8, font: { size: 10 } },
          grid: { color: clr('--border') + '55' },
        },
        y: {
          min: 0,
          max: 100,
          ticks: { color: clr('--muted'), font: { size: 10 }, callback: v => v + '¢' },
          grid: { color: clr('--border') + '55' },
        },
      },
    },
  });
}

/* ─────────────────────────────────────────
   BOOT
   ───────────────────────────────────────── */
window.addEventListener('DOMContentLoaded', () => {
  lucide.createIcons();
  fetchPortfolio();
  fetchBotLog();
  setInterval(fetchPortfolio, 30_000);
  setInterval(fetchBotLog, 30_000);
});
</script>
