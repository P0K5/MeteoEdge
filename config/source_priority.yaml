# High-cadence feeds (AMOS, MSS, JMA) take priority over METAR where available.
# METAR-only entries (cadence_min: 30) enable intraday bias correction for all
# remaining stations via compute_correction() in src/model/intraday_correction.py.
# Without an entry here, compute_correction() returns None immediately and no
# delta_f samples ever accumulate for that city.

# --- High-cadence feeds ---

Tokyo:
  - source: jma_ameidas
    station: Tokyo
    cadence_min: 10
    is_official: true
  - source: metar
    station: RJTT
    cadence_min: 30
    is_official: true

# Issue #740: the amos entries (KMA ASOS / Open-Meteo fallback) are removed.
# KMA ASOS was unobtainable by design (archive-only, issue #694) and the
# Open-Meteo fallback never produced official readings -- both are retired
# in src/data/collectors/amos.py. METAR (RKSI/RKPK) is now the sole, primary
# Korea observation source and doubles as this city's intraday-correction
# entry (see the module comment at the top of this file).
Seoul:
  - source: metar
    station: RKSI
    cadence_min: 30
    is_official: true

Busan:
  - source: metar
    station: RKPK
    cadence_min: 30
    is_official: true

Singapore:
  - source: mss
    station: Singapore
    cadence_min: 1
    is_official: true
  - source: metar
    station: WSSS
    cadence_min: 30
    is_official: true

