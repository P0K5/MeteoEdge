# High-cadence feeds (AMOS, MSS, JMA) take priority over METAR where available.
# METAR-only entries (cadence_min: 30) enable intraday bias correction for all
# remaining stations via compute_correction() in src/model/intraday_correction.py.
# Without an entry here, compute_correction() returns None immediately and no
# delta_f samples ever accumulate for that city.

# --- High-cadence feeds ---

Tokyo:
  - source: jma_ameidas
    station: Tokyo
    cadence_min: 10
    is_official: true
  - source: metar
    station: RJTT
    cadence_min: 30
    is_official: true

Seoul:
  - source: amos
    station: Seoul
    cadence_min: 15
    is_official: true
  - source: metar
    station: RKSI
    cadence_min: 30
    is_official: true

Busan:
  - source: amos
    station: Busan
    cadence_min: 15
    is_official: true
  - source: metar
    station: RKPK
    cadence_min: 30
    is_official: true

Singapore:
  - source: mss
    station: Singapore
    cadence_min: 1
    is_official: true
  - source: metar
    station: WSSS
    cadence_min: 30
    is_official: true

